<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vacation Banner</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background-color: #FAF4EE;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
    /* Контейнер у пропорції під сторіз або квадрат */
    .vacation-card {
      width: 380px;
      padding: 40px 30px;
      background: linear-gradient(145deg, #E07A5F 0%, #F4A261 60%, #E9C46A 100%);
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(224, 122, 95, 0.25);
      color: #FFFFFF;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    /* Декоративне тепле сяйво */
    .vacation-card::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 180px;
      height: 180px;
      background: rgba(255, 255, 255, 0.18);
      border-radius: 50%;
      blur: 10px;
    }
    .badge {
      display: inline-block;
      background: rgba(255, 255, 255, 0.25);
      backdrop-filter: blur(10px);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 24px;
      border: 1px solid rgba(255, 255, 255, 0.3);
    }
    .title {
      font-size: 32px;
      font-weight: 800;
      line-height: 1.25;
      margin-bottom: 16px;
      text-shadow: 0 2px 10px rgba(0,0,0,0.05);
    }
    .description {
      font-size: 16px;
      line-height: 1.5;
      opacity: 0.95;
      margin-bottom: 32px;
      font-weight: 400;
    }
    .status-box {
      background: #FFFFFF;
      color: #2D232E;
      padding: 14px 20px;
      border-radius: 16px;
      font-weight: 700;
      font-size: 14px;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background-color: #2A9D8F;
      border-radius: 50%;
      box-shadow: 0 0 8px #2A9D8F;
    }
  </style>
</head>
<body>

  <div class="vacation-card">
    <div class="badge">Офіційна пауза ☀️</div>
    <h1 class="title">Я у відпустці!</h1>
    <p class="description">Робочі чати на паузі, сповіщення вимкнено. Повернуся з новими ідеями та засмагою.</p>
    <div class="status-box">
      <span class="status-dot"></span>
      Статус: Offline / Режим відпочинку
    </div>
  </div>

</body>
</html>
