<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тест: Властивості числових нерівностей</title>
<script>
  window.MathJax = {
    tex: {
      inlineMath: [['\\(', '\\)']],
      displayMath: [['\\[', '\\]']]
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
  body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 800px; margin: 0 auto; padding: 20px; line-height: 1.6; color: #333; background-color: #fcfdfd; }
  h1 { text-align: center; color: #2c3e50; font-size: 24px; margin-bottom: 30px; border-bottom: 3px solid #34495e; padding-bottom: 10px; }
  .question { margin-bottom: 25px; padding: 25px; border: 1px solid #e2e8f0; border-radius: 12px; background-color: #ffffff; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
  .question p { margin-top: 0; font-size: 18px; color: #2d3748; font-weight: 600; }
  .options label { display: block; margin-bottom: 12px; cursor: pointer; padding: 10px 15px; border: 1px solid #edf2f7; border-radius: 8px; transition: all 0.2s; font-size: 16px; }
  .options label:hover { background-color: #f7fafc; border-color: #cbd5e0; }
  .options input[type="radio"] { margin-right: 12px; transform: scale(1.1); }
  button { display: block; width: 100%; padding: 15px; font-size: 18px; font-weight: bold; cursor: pointer; background: #2b6cb0; color: white; border: none; border-radius: 10px; transition: background 0.3s; box-shadow: 0 4px 6px rgba(43,108,176,0.2); }
  button:hover { background: #2c5282; }
  #result-container { display: none; margin-top: 30px; padding: 25px; background: #ebf8ff; border: 2px solid #bee3f8; border-radius: 12px; text-align: center; }
  #result-container h2 { margin-top: 0; color: #2b6cb0; font-size: 22px; }
  .correct-ans { color: #2f855a; font-weight: bold; background-color: #f0fff4; border: 1px solid #c6f6d5 !important; }
  .wrong-ans { color: #9b2c2c; font-weight: bold; background-color: #fff5f5; border: 1px solid #fed7d7 !important; }
  #link-output { width: 100%; padding: 14px; margin-top: 15px; box-sizing: border-box; border: 2px solid #e2e8f0; border-radius: 8px; font-size: 15px; background: #fff; color: #4a5568; }
  ul { list-style-type: none; padding-left: 0; margin: 0; }
  li { margin-bottom: 10px; padding: 12px; border-radius: 8px; border: 1px solid transparent; }
</style>
</head>
<body>

<h1>Тест: Властивості числових нерівностей</h1>

<div id="test-container"></div>

<button id="submit-btn" onclick="submitTest()">Завершити тест та отримати посилання</button>

<div id="result-container">
  <h2>Результат тесту: <span id="score"></span> / 15</h2>
  <p style="font-size: 16px; color: #4a5568;">Скопіюйте згенероване посилання та надішліть його вчителю:</p>
  <input type="text" id="link-output" readonly>
  <button onclick="copyLink()" style="margin-top: 15px; background: #319795; box-shadow: 0 4px 6px rgba(49,151,149,0.2);">Копіювати посилання</button>
</div>

<div id="teacher-view" style="display:none;"></div>

<script>
const questions = [
    { q: "1. Відомо, що \\(a \\gt b\\). Яка з наведених нерівностей обов'язково є правильною?", options: ["\\(a + 23 \\lt b + 23\\)", "\\(a + 23 \\gt b + 23\\)", "\\(-23a \\gt -23b\\)", "\\(\\frac{a}{23} \\lt \\frac{b}{23}\\)"], ans: 1 },
    { q: "2. Оцініть значення виразу \\(7x\\), якщо відомо, що \\(2 \\lt x \\lt 5\\).", options: ["\\(9 \\lt 7x \\lt 12\\)", "\\(14 \\lt 7x \\lt 35\\)", "\\(2 \\lt 7x \\lt 5\\)", "\\(14 \\lt x \\lt 35\\)"], ans: 1 },
    { q: "3. Оцініть значення виразу \\(y - 11\\), якщо відомо, що \\(12 \\lt y \\lt 18\\).", options: ["\\(1 \\lt y - 11 \\lt 7\\)", "\\(23 \\lt y - 11 \\lt 29\\)", "\\(1 \\lt y \\lt 7\\)", "\\(12 \\lt y - 11 \\lt 18\\)"], ans: 0 },
    { q: "4. О0цініть значення виразу \\(-3p\\), якщо відомо, що \\(4 \\lt p \\lt 6\\).", options: ["\\(-12 \\lt -3p \\lt -18\\)", "\\(-18 \\lt -3p \\lt -12\\)", "\\(12 \\lt 3p \\lt 18\\)", "\\(-12 \\lt -3p\\)"], ans: 1 },
    { q: "5. Порівняйте числа \\(m\\) і \\(n\\), якщо відомо, що \\(m \\lt 13\\) та \\(13 \\lt n\\).", options: ["\\(m \\gt n\\)", "\\(m = n\\)", "\\(m \\lt n\\)", "Порівняти неможливо"], ans: 2 },
    { q: "6. Порівняйте число \\(x\\) з нулем, якщо відомо, що \\(x \\gt y\\) та \\(y \\ge 8\\).", options: ["\\(x \\lt 0\\)", "\\(x \\gt 0\\)", "\\(x = 0\\)", "Порівняти неможливо"], ans: 1 },
    { q: "7. Яким знаком треба замінити зірочку в нерівності \\(-15a \\ast -15b\\), якщо відомо, що \\(a \\lt b\\)?", options: ["\\(\\lt\\)", "\\(=\\)", "\\(\\gt\\)", "\\(\\le\\)"], ans: 2 },
    { q: "8. Оцініть значення виразу \\(\\frac{c}{9}\\), якщо відомо, що \\(18 \\lt c \\lt 45\\).", options: ["\\(2 \\lt \\frac{c}{9} \\lt 5\\)", "\\(162 \\lt \\frac{c}{9} \\lt 405\\)", "\\(2 \\lt c \\lt 5\\)", "\\(9 \\lt \\frac{c}{9} \\lt 18\\)"], ans: 0 },
    { q: "9. Відомо, що \\(x \\gt y\\). Порівняйте значення виразів \\(x + 31\\) та \\(y\\).", options: ["\\(x + 31 \\lt y\\)", "\\(x + 31 = y\\)", "Порівняти неможливо", "\\(x + 31 \\gt y\\)"], ans: 3 },
    { q: "10. Обидві частини нерівності \\(-4 \\lt 3\\) помножили на \\(-2\\). Яку правильну нерівність отримали?", options: ["\\(8 \\gt -6\\)", "\\(8 \\lt -6\\)", "\\(-8 \\gt 6\\)", "\\(-8 \\lt -6\\)"], ans: 0 },
    { q: "11. Порівняйте значення дробів \\(\\frac{1}{x}\\) і \\(\\frac{1}{17}\\), якщо відомо, що \\(x \\gt 17\\).", options: ["\\(\\frac{1}{x} \\gt \\frac{1}{17}\\)", "\\(\\frac{1}{x} \\lt \\frac{1}{17}\\)", "\\(\\frac{1}{x} = \\frac{1}{17}\\)", "Порівняти неможливо"], ans: 1 },
    { q: "12. Оцініть значення виразу \\(25 - x\\), якщо відомо, що \\(1 \\lt x \\lt 10\\).", options: ["\\(24 \\lt 25 - x \\lt 15\\)", "\\(26 \\lt 25 - x \\lt 35\\)", "\\(15 \\lt 25 - x \\lt 24\\)", "\\(-15 \\lt 25 - x \\lt -24\\)"], ans: 2 },
    { q: "13. Відомо, що \\(a \\lt b\\), \\(b \\lt c\\) та \\(c \\lt d\\). Яка з точок розташована на координатній прямій найлівіше?", options: ["Точка d", "Точка c", "Точка b", "Точка a"], ans: 3 },
    { q: "14. Відомо, що \\(p \\lt q\\). Порівняйте значення виразів \\(p - 50\\) та \\(q - 50\\).", options: ["\\(p - 50 \\gt q - 50\\)", "\\(p - 50 \\lt q - 50\\)", "\\(p - 50 = q - 50\\)", "Порівняти неможливо"], ans: 1 },
    { q: "15. Оцініть значення виразу \\(8m + 3\\), якщо відомо, що \\(2 \\lt m \\lt 4\\).", options: ["\\(16 \\lt 8m + 3 \\lt 32\\)", "\\(19 \\lt 8m + 3 \\lt 35\\)", "\\(19 \\lt m \\lt 35\\)", "\\(5 \\lt 8m + 3 \\lt 7\\)"], ans: 1 }
];

function renderTest() {
    const container = document.getElementById('test-container');
    let html = '';
    questions.forEach((q, i) => {
        html += `<div class="question"><p>${q.q}</p><div class="options">`;
        q.options.forEach((opt, j) => {
            html += `<label><input type="radio" name="q${i}" value="${j}"> ${opt}</label>`;
        });
        html += `</div></div>`;
    });
    container.innerHTML = html;
    
    if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

function submitTest() {
    let answers = [];
    let score = 0;
    
    questions.forEach((q, i) => {
        const selected = document.querySelector(`input[name="q${i}"]:checked`);
        const val = selected ? parseInt(selected.value) : -1;
        answers.push(val);
        if(val === q.ans) score++;
    });
    
    document.getElementById('score').innerText = score;
    
    const data = { a: answers };
    const hash = btoa(JSON.stringify(data));
    const url = window.location.href.split('#')[0] + '#' + hash;
    
    document.getElementById('link-output').value = url;
    document.getElementById('result-container').style.display = 'block';
    document.getElementById('submit-btn').style.display = 'none';
    
    const inputs = document.querySelectorAll('input[type="radio"]');
    inputs.forEach(input => input.disabled = true);
    
    window.scrollTo(0, document.body.scrollHeight);
}

function copyLink() {
    const copyText = document.getElementById("link-output");
    copyText.select();
    document.execCommand("copy");
    alert("Посилання скопійовано! Надішліть його для перевірки.");
}

function renderTeacherView(data) {
    document.getElementById('test-container').style.display = 'none';
    document.getElementById('submit-btn').style.display = 'none';
    
    const tv = document.getElementById('teacher-view');
    tv.style.display = 'block';
    
    let score = 0;
    let html = `<div style="background:#fffaf0; padding:20px; border-radius:12px; border:2px solid #feebc8; margin-bottom:30px; text-align:center;">
                <h2 style="margin:0; color:#dd6b20; font-size:22px;">Режим перевірки відповідей учня</h2></div>`;
    
    questions.forEach((q, i) => {
        const studentAns = data.a[i];
        const isCorrect = studentAns === q.ans;
        if(isCorrect) score++;
        
        let borderStyle = isCorrect ? "border-left: 6px solid #38a169;" : "border-left: 6px solid #e53e3e;";
        
        html += `<div class="question" style="${borderStyle}"><p>${q.q}</p><ul>`;
        q.options.forEach((opt, j) => {
            let style = "";
            let marker = "&nbsp;&nbsp;&nbsp;&nbsp;";
            
            if(j === q.ans) {
                style = "class='correct-ans'";
                marker = "✓ ";
            } else if(j === studentAns && !isCorrect) {
                style = "class='wrong-ans'";
                marker = "✗ ";
            } else if (j === studentAns && isCorrect) {
                marker = "✓ ";
            }
            
            html += `<li ${style}>${marker}${opt}</li>`;
        });
        
        if (studentAns === -1) {
            html += `<p style="color:#dd6b20; font-weight:bold; margin-top:10px; font-size:15px;">⚠ Учень пропустив це питання.</p>`;
        }
        
        html += `</ul></div>`;
    });
    
    html = `<h2 style="text-align:center; font-size:26px; color:#2b6cb0; margin-bottom:20px;">Загальний бал учня: ${score} з 15</h2>` + html;
    tv.innerHTML = html;
    
    if (window.MathJax && window.MathJax.typesetPromise) {
        MathJax.typesetPromise();
    }
}

window.onload = () => {
    if(window.location.hash) {
        try {
            const data = JSON.parse(atob(window.location.hash.substring(1)));
            renderTeacherView(data);
        } catch(e) {
            renderTest();
        }
    } else {
        renderTest();
    }
};
</script>
</body>
</html>
