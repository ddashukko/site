<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Тренажер: Дослідження операцій</title>
<script src="https://polyfill.io/v3/polyfill.min.js?features=es6"></script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<script>
window.MathJax = {
  tex: {
    inlineMath: [['$', '$'], ['\\(', '\\)']]
  }
};
</script>
<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background-color: #f4f7f6;
    color: #333;
    line-height: 1.6;
    padding: 20px;
    max-width: 800px;
    margin: 0 auto;
}
.quiz-container {
    background: #fff;
    padding: 30px;
    border-radius: 10px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
}
h1 {
    text-align: center;
    color: #2c3e50;
}
.question {
    font-size: 1.2em;
    font-weight: bold;
    margin-bottom: 15px;
}
.options {
    list-style-type: none;
    padding: 0;
}
.options li {
    margin-bottom: 10px;
}
.options label {
    display: block;
    padding: 10px;
    background: #eef2f3;
    border: 2px solid transparent;
    border-radius: 5px;
    cursor: pointer;
    transition: all 0.3s;
}
.options label:hover {
    background: #dfe6e9;
}
input[type="radio"] {
    display: none;
}
input[type="radio"]:checked + label {
    background: #3498db;
    color: #fff;
    border-color: #2980b9;
}
button {
    display: block;
    width: 100%;
    padding: 15px;
    background: #2ecc71;
    color: white;
    border: none;
    border-radius: 5px;
    font-size: 1.1em;
    cursor: pointer;
    margin-top: 20px;
    transition: background 0.3s;
}
button:hover {
    background: #27ae60;
}
#result {
    margin-top: 20px;
    font-size: 1.2em;
    text-align: center;
    font-weight: bold;
}
.explanation {
    margin-top: 10px;
    padding: 15px;
    background: #fdfefe;
    border-left: 4px solid #f39c12;
    display: none;
}
.correct-label {
    background: #2ecc71 !important;
    color: white !important;
    border-color: #27ae60 !important;
}
.incorrect-label {
    background: #e74c3c !important;
    color: white !important;
    border-color: #c0392b !important;
}
</style>
</head>
<body>

<div class="quiz-container">
    <h1>Білет №14: Перевірка знань</h1>
    <div id="quiz"></div>
    <button id="submit">Перевірити відповіді</button>
    <div id="result"></div>
</div>

<script>
const quizData = [
    {
        question: "1. Яка умова обов'язково має виконуватися для закритої транспортної задачі?",
        options: [
            "Тарифи на перевезення мають бути нульовими.",
            "Сумарний запас постачальників дорівнює сумарній потребі споживачів $\\sum a_i = \\sum b_j$.",
            "Кількість постачальників має дорівнювати кількості споживачів $m = n$.",
            "Сумарний запас має бути більшим за сумарну потребу."
        ],
        correct: 1,
        explanation: "Закрита модель передбачає повний баланс між запасами та потребами. Якщо балансу немає, задача є відкритою і потребує введення фіктивного пункту."
    },
    {
        question: "2. Що необхідно зробити, якщо у транспортній задачі $\\sum a_i > \\sum b_j$?",
        options: [
            "Ввести фіктивного постачальника з тарифами 0.",
            "Зменшити запаси реальних постачальників.",
            "Ввести фіктивного споживача з тарифами 0.",
            "Збільшити потреби існуючих споживачів."
        ],
        correct: 2,
        explanation: "Оскільки запасу більше, ніж потрібно (надлишок), ми створюємо фіктивного споживача, який «забере» цей надлишок. Фізично цей вантаж просто залишиться на складі."
    },
    {
        question: "3. Для якої функції стаціонарна точка (де градієнт дорівнює нулю) гарантовано є точкою глобального мінімуму?",
        options: [
            "Для будь-якої неперервної функції.",
            "Для будь-якої функції багатьох змінних.",
            "Для опуклої диференційовної функції на опуклій множині.",
            "Для лінійної функції."
        ],
        correct: 2,
        explanation: "Це наслідок теореми про необхідну і достатню умову глобального мінімуму. Опукла функція не має локальних мінімумів, які не були б глобальними."
    },
    {
        question: "4. Який економічний зміст двоїстих змінних $y_1$ та $y_2$ у вашій задачі?",
        options: [
            "Це обсяги виробленої продукції першого та другого типу.",
            "Це тіньові ціни ресурсів, що показують на скільки зросте прибуток при збільшенні запасу ресурсу на 1 одиницю.",
            "Це витрати на виробництво однієї одиниці продукції.",
            "Це залишки невикористаних ресурсів на складі."
        ],
        correct: 1,
        explanation: "Двоїсті змінні (оцінки) показують цінність кожної додаткової одиниці обмеженого ресурсу для максимізації цільової функції."
    },
    {
        question: "5. За першою теоремою двоїстості, якщо існує оптимальний розв'язок прямої задачі, то:",
        options: [
            "Двоїста задача не має розв'язку.",
            "$L_{\\max} = W_{\\min}$ (оптимальні значення цільових функцій збігаються).",
            "$L_{\\max} > W_{\\min}$.",
            "Оптимальні плани прямої і двоїстої задач однакові."
        ],
        correct: 1,
        explanation: "Перша теорема (основна теорема двоїстості) стверджує, що екстремальні значення цільових функцій обох задач збігаються."
    },
    {
        question: "6. Якщо оптимальний план двоїстої задачі $y^* = (2.2; 0.6)$, що станеться, якщо запас другого ресурсу збільшити на 10 одиниць?",
        options: [
            "Прибуток збільшиться на 6 ум. од.",
            "Прибуток збільшиться на 22 ум. од.",
            "Прибуток не зміниться.",
            "Прибуток зменшиться на 6 ум. од."
        ],
        correct: 0,
        explanation: "Тіньова ціна другого ресурсу $y_2 = 0.6$. Отже, $10 \\times 0.6 = 6$. Прибуток зросте на 6 одиниць."
    },
    {
        question: "7. Що означає термін «ЛП-релаксація» у методі Гоморі?",
        options: [
            "Перехід від задачі на мінімум до задачі на максимум.",
            "Відкидання обмежень на невід'ємність змінних.",
            "Розв'язання задачі з ігноруванням умови цілочисельності змінних.",
            "Спрощення цільової функції шляхом відкидання констант."
        ],
        correct: 2,
        explanation: "ЛП-релаксація (від англ. relaxation — послаблення) — це розв'язання задачі звичайним симплекс-методом, тимчасово ігноруючи умову $x_i \\in \\mathbb{Z}$."
    },
    {
        question: "8. Як геометрично діє відтин Гоморі?",
        options: [
            "Відсікає частину області допустимих розв'язків разом із знайденим нецілочисельним оптимумом, але не відсікає жодного цілочисельного плану.",
            "Відсікає всі цілочисельні точки.",
            "Збільшує область допустимих розв'язків.",
            "Переносить початок координат у точку знайденого оптимуму."
        ],
        correct: 0,
        explanation: "Сенс методу відтинів — поступово «зрізати» нецілі вершини багатогранника рішень, поки оптимальна вершина не стане цілочисельною."
    },
    {
        question: "9. На основі чого будується перший відтин Гоморі-I?",
        options: [
            "На основі цільової функції початкової задачі.",
            "На основі рівняння для тієї базисної змінної з останньої симплекс-таблиці, яка набула дробового значення.",
            "На основі будь-якого неактивного обмеження.",
            "Шляхом випадкового вибору коефіцієнтів."
        ],
        correct: 1,
        explanation: "У вашому розв'язку $x_1 = \\frac{7}{3}$, тому виписано рівняння саме для $x_1$, після чого дробові частини відділені для створення нового обмеження."
    },
    {
        question: "10. Чому після додавання відтину Гоморі до симплекс-таблиці використовується саме двоїстий симплекс-метод?",
        options: [
            "Тому що пряма задача стає відкритою.",
            "Тому що в стовпці вільних членів з'являється від'ємне число (план стає псевдооптимальним).",
            "Бо цільова функція змінює знак.",
            "Двоїстий симплекс-метод працює швидше за звичайний."
        ],
        correct: 1,
        explanation: "Відтин вводиться у вигляді $-... + x_k = -\\text{дробова частина}$. Від'ємний вільний член означає, що поточний базис втратив допустимість, тому застосовується двоїстий метод для відновлення допустимості без втрати оптимальності."
    }
];

const quizContainer = document.getElementById('quiz');
const submitButton = document.getElementById('submit');
const resultContainer = document.getElementById('result');

function buildQuiz() {
    quizData.forEach((data, index) => {
        const questionDiv = document.createElement('div');
        questionDiv.classList.add('question-block');

        const questionTitle = document.createElement('div');
        questionTitle.classList.add('question');
        questionTitle.innerHTML = data.question;
        questionDiv.appendChild(questionTitle);

        const optionsList = document.createElement('ul');
        optionsList.classList.add('options');

        data.options.forEach((option, optionIndex) => {
            const listItem = document.createElement('li');
            
            const radioInput = document.createElement('input');
            radioInput.type = 'radio';
            radioInput.name = `question${index}`;
            radioInput.id = `q${index}o${optionIndex}`;
            radioInput.value = optionIndex;

            const label = document.createElement('label');
            label.htmlFor = `q${index}o${optionIndex}`;
            label.innerHTML = option;

            listItem.appendChild(radioInput);
            listItem.appendChild(label);
            optionsList.appendChild(listItem);
        });

        questionDiv.appendChild(optionsList);

        const explanationDiv = document.createElement('div');
        explanationDiv.classList.add('explanation');
        explanationDiv.id = `expl${index}`;
        explanationDiv.innerHTML = `<strong>Пояснення:</strong> ${data.explanation}`;
        questionDiv.appendChild(explanationDiv);

        quizContainer.appendChild(questionDiv);
    });
}

function showResults() {
    let score = 0;

    quizData.forEach((data, index) => {
        const selectedOption = document.querySelector(`input[name="question${index}"]:checked`);
        const explanationDiv = document.getElementById(`expl${index}`);
        const options = document.querySelectorAll(`input[name="question${index}"]`);

        options.forEach((opt) => {
            opt.disabled = true;
            const label = opt.nextElementSibling;
            
            if (parseInt(opt.value) === data.correct) {
                label.classList.add('correct-label');
            }
        });

        if (selectedOption) {
            const userAnswer = parseInt(selectedOption.value);
            if (userAnswer === data.correct) {
                score++;
            } else {
                selectedOption.nextElementSibling.classList.add('incorrect-label');
            }
        }
        
        explanationDiv.style.display = 'block';
    });

    resultContainer.innerHTML = `Твій результат: ${score} з ${quizData.length}`;
    if(window.MathJax) {
        window.MathJax.typesetPromise();
    }
    submitButton.style.display = 'none';
}

buildQuiz();
submitButton.addEventListener('click', showResults);
</script>
</body>
</html>
