<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Story – Салон Краси</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a1a1a;
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.4);
      --accent-color: #8e7d71;
      --danger: #d9534f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

    body {
      background: #ece9e6;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 20px;
      color: #333;
    }

    .container {
      display: flex;
      gap: 30px;
      max-width: 1000px;
      width: 100%;
      flex-wrap: wrap;
      justify-content: center;
    }

    /* Панель введення */
    .form-panel {
      flex: 1;
      min-width: 340px;
      background: #ffffff;
      padding: 25px;
      border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
      max-height: 90vh;
      overflow-y: auto;
    }

    .form-panel h2 { font-size: 1.2rem; font-weight: 600; margin-bottom: 15px; color: var(--primary); }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; color: #666; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; outline: none; transition: 0.2s;
    }
    .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: var(--accent-color); }

    /* Динамічні блоки майстрів у формі */
    .master-form-card {
      background: #f9f9f9;
      border: 1px solid #eee;
      padding: 15px;
      border-radius: 12px;
      margin-bottom: 15px;
      position: relative;
    }
    
    .remove-btn {
      position: absolute; top: 10px; right: 10px;
      background: var(--danger); color: white; border: none;
      width: 24px; height: 24px; border-radius: 50%;
      cursor: pointer; font-weight: bold; font-size: 12px;
      display: flex; align-items: center; justify-content: center;
    }

    .add-controls { display: flex; gap: 10px; margin-bottom: 20px; }
    .add-controls select { flex: 1; }
    .btn-add {
      background: var(--primary); color: #fff; border: none; padding: 10px 15px;
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
    }

    /* Попередній перегляд Story */
    .preview-panel {
      width: 340px; height: 604px; position: sticky; top: 20px;
      border-radius: 24px; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      background: #ccc url('salon.jpg') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px;
    }
    .preview-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.15); z-index: 1;
    }

    .story-content {
      position: relative; z-index: 2; display: flex; flex-direction: column; gap: 15px; height: 100%; justify-content: space-between;
    }

    .date-badge {
      align-self: center; background: var(--glass-bg); backdrop-filter: blur(12px);
      border: 1px solid var(--glass-border); padding: 8px 20px; border-radius: 30px;
      font-weight: 600; font-size: 1rem; color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05);
    }

    .glass-card {
      background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 18px; padding: 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      max-height: 400px; overflow: hidden;
    }

    .master-block { margin-bottom: 12px; }
    .master-block:last-child { margin-bottom: 0; }
    .master-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-color); margin-bottom: 4px; }
    .slots-list { font-size: 0.9rem; color: var(--primary); line-height: 1.4; white-space: pre-line; font-weight: 500; }
    .divider { height: 1px; background: rgba(0,0,0,0.08); margin: 10px 0; }

    .cta-button {
      background: var(--primary); color: #fff; text-align: center; padding: 12px;
      border-radius: 30px; font-weight: 600; font-size: 0.8rem; letter-spacing: 1.5px;
      text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Форма редгування -->
  <div class="form-panel">
    <h2>Налаштування</h2>
    
    <div class="input-group">
      <label>Фон (Назва файлу або URL)</label>
      <input type="text" id="inBg" value="salon.jpg">
    </div>

    <div class="input-group">
      <label>Дата</label>
      <input type="text" id="inDate" value="04.08 - 05.08">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
    
    <div class="add-controls">
      <select id="presetMaster">
        <option value="">-- Додати порожнього --</option>
        <option value="топ Катерина">топ Катерина</option>
        <option value="топ+ Христина">топ+ Христина</option>
        <option value="топ+ Наталія">топ+ Наталія</option>
        <option value="топ+ Тетяна">топ+ Тетяна</option>
        <option value="майстер-бровист Ілона">майстер-бровист Ілона</option>
      </select>
      <button class="btn-add" onclick="addMaster()">+ ДОДАТИ</button>
    </div>

    <div id="mastersContainer">
      <!-- Динамічні форми майстрів з'являтимуться тут -->
    </div>
  </div>

  <!-- Прев'ю Instagram Story -->
  <div class="preview-panel" id="previewBg">
    <div class="story-content">
      <div class="date-badge" id="outDate">04.08 - 05.08</div>
      
      <div class="glass-card" id="outGlassCard" style="display: none;">
        <!-- Динамічні блоки майстрів з'являтимуться тут -->
      </div>

      <div class="cta-button">Записатись</div>
    </div>
  </div>
</div>

<script>
  let masters = [
    { id: 1, title: 'топ Катерина', text: '09:00 — гігієнічний манікюр\n17:00 — манікюр' },
    { id: 2, title: 'топ+ Христина', text: '14:30' }
  ];

  // Зміна дати та фону
  document.getElementById('inDate').addEventListener('input', e => document.getElementById('outDate').innerText = e.target.value);
  document.getElementById('inBg').addEventListener('input', e => document.getElementById('previewBg').style.backgroundImage = `url('${e.target.value}')`);

  // Функція рендеру списків
  function render() {
    const formContainer = document.getElementById('mastersContainer');
    const previewContainer = document.getElementById('outGlassCard');
    
    formContainer.innerHTML = '';
    previewContainer.innerHTML = '';

    if(masters.length === 0) {
      previewContainer.style.display = 'none';
      return;
    }
    previewContainer.style.display = 'block';

    masters.forEach((master, index) => {
      // 1. Рендер форми зліва
      const formCard = document.createElement('div');
      formCard.className = 'master-form-card';
      formCard.innerHTML = `
        <button class="remove-btn" onclick="removeMaster(${master.id})">✕</button>
        <div class="input-group">
          <label>Ім'я / Посада</label>
          <input type="text" value="${master.title}" oninput="updateMaster(${master.id}, 'title', this.value)">
        </div>
        <div class="input-group">
          <label>Інформація (віконця, послуги, тощо)</label>
          <textarea rows="2" oninput="updateMaster(${master.id}, 'text', this.value)">${master.text}</textarea>
        </div>
      `;
      formContainer.appendChild(formCard);

      // 2. Рендер прев'ю справа
      const previewBlock = document.createElement('div');
      previewBlock.className = 'master-block';
      const formattedText = master.text.replace(/\n/g, '<br>');
      previewBlock.innerHTML = `
        <div class="master-title">${master.title}</div>
        <div class="slots-list">${formattedText}</div>
      `;
      
      previewContainer.appendChild(previewBlock);
      
      // Додаємо розділювач, якщо це не останній елемент
      if(index < masters.length - 1) {
        const divider = document.createElement('div');
        divider.className = 'divider';
        previewContainer.appendChild(divider);
      }
    });
  }

  function addMaster() {
    const select = document.getElementById('presetMaster');
    const newMaster = {
      id: Date.now(),
      title: select.value,
      text: select.value === 'майстер-бровист Ілона' ? 'Є вільні місця' : '10:00 - манікюр'
    };
    if (select.value === "") newMaster.text = ""; 
    masters.push(newMaster);
    render();
  }

  function removeMaster(id) {
    masters = masters.filter(m => m.id !== id);
    render();
  }

  function updateMaster(id, field, value) {
    const master = masters.find(m => m.id === id);
    if(master) {
      master[field] = value;
      render();
    }
  }

  // Перший запуск
  render();
</script>

</body>
</html>
