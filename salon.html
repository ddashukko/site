<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Розкладу</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Бібліотека для збереження PNG -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  
  <style>
    /* СВІТЛА ТЕМА */
    :root {
      --primary-text: #1a1a1a;
      --glass-bg: rgba(255, 255, 255, 0.55); 
      --glass-border: rgba(255, 255, 255, 0.6);
      --accent-color: #5a4f46; 
      --overlay: linear-gradient(180deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.65) 100%);
      --divider: rgba(0, 0, 0, 0.12);
      --danger: #d9534f;
      --bg-color: #f4f4f5;
    }

    /* ТЕМНА ТЕМА */
    [data-theme="dark"] {
      --primary-text: #ffffff;
      --glass-bg: rgba(0, 0, 0, 0.55); 
      --glass-border: rgba(255, 255, 255, 0.15);
      --accent-color: #d8c8b8; 
      --overlay: linear-gradient(180deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0.75) 100%);
      --divider: rgba(255, 255, 255, 0.15);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

    body {
      background: var(--bg-color); display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 20px; color: #222;
    }

    .container {
      display: flex; gap: 30px; max-width: 1050px; width: 100%; flex-wrap: wrap; justify-content: center;
    }

    /* ПАНЕЛЬ НАЛАШТУВАНЬ */
    .form-panel {
      flex: 1; min-width: 340px; max-width: 500px; background: #ffffff; padding: 25px; 
      border-radius: 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); 
      display: flex; flex-direction: column; max-height: 90vh;
    }

    .form-panel h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; color: #1a1a1a; text-transform: uppercase; letter-spacing: 1px; }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.75rem; font-weight: 600; margin-bottom: 6px; text-transform: uppercase; color: #555; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%; padding: 10px 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 0.9rem; outline: none; background: #fafafa;
    }
    
    .panel-controls { flex-shrink: 0; margin-bottom: 10px; }
    
    #itemsContainer {
      flex: 1; overflow-y: auto; padding-right: 5px; margin-bottom: 20px;
    }
    #itemsContainer::-webkit-scrollbar { width: 6px; }
    #itemsContainer::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }

    .form-card {
      background: #fff; border: 1px solid #e0e0e0; padding: 15px; border-radius: 8px;
      margin-bottom: 12px; position: relative; box-shadow: 0 2px 5px rgba(0,0,0,0.02);
    }
    .form-card.date-card { background: #f8fafc; border-left: 4px solid #4a5568; }
    .form-card.master-card { border-left: 4px solid #8e7d71; }
    
    .remove-btn {
      position: absolute; top: 12px; right: 12px; background: transparent; color: var(--danger);
      border: none; font-size: 18px; cursor: pointer; line-height: 1;
    }

    .add-controls { display: flex; gap: 10px; margin-bottom: 15px; }
    .btn {
      color: #fff; border: none; padding: 12px 15px; border-radius: 6px; 
      cursor: pointer; font-weight: 600; font-size: 0.8rem; text-transform: uppercase;
      transition: opacity 0.2s; text-align: center; width: 100%; display: inline-block;
    }
    .btn:hover { opacity: 0.9; }
    .btn-dark { background: #1a1a1a; }
    .btn-gray { background: #4a5568; }
    .btn-success { background: #2f855a; margin-top: 10px; font-size: 0.9rem; letter-spacing: 1px; }

    /* ПРЕВ'Ю (9:16 ПРОПОРЦІЇ) */
    .preview-panel {
      width: 360px; height: 640px; /* Суворі пропорції Stories */
      position: sticky; top: 20px; border-radius: 16px;
      overflow: hidden; box-shadow: 0 15px 35px rgba(0,0,0,0.15);
      background: #ccc url('salon.png') center/cover no-repeat;
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    
    .preview-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: var(--overlay); z-index: 1; transition: background 0.3s;
    }

    .story-content {
      position: relative; z-index: 2; display: flex; flex-direction: column; 
      height: 100%; padding: 25px 20px 0 20px;
    }

    .cards-wrapper {
      flex: 1; display: flex; flex-direction: column; gap: 15px; 
      transform-origin: top center; transition: transform 0.2s ease;
    }

    /* БЕЗПЕЧНА ЗОНА (ДЛЯ КНОПКИ INSTAGRAM) */
    .safe-zone {
      height: 110px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      border-top: 1px dashed rgba(255,255,255,0.4);
      color: rgba(255,255,255,0.7); font-size: 0.75rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; text-align: center;
    }

    .date-group { display: flex; flex-direction: column; gap: 6px; max-width: 90%; }
    .date-group.align-left { align-self: flex-start; align-items: flex-start; }
    .date-group.align-right { align-self: flex-end; align-items: flex-end; }
    .date-group.align-right .glass-card { text-align: left; width: 100%; }

    .date-badge {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); padding: 5px 16px; border-radius: 20px; 
      font-weight: 700; font-size: 0.9rem; color: var(--primary-text); 
      box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: inline-block;
    }

    .glass-card {
      background: var(--glass-bg); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--glass-border); border-radius: 16px; padding: 12px 16px;
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08); width: 100%;
    }

    .master-block { margin-bottom: 10px; }
    .master-block:last-child { margin-bottom: 0; }
    .master-title { font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.5px; color: var(--accent-color); margin-bottom: 2px; }
    .slots-list { font-size: 0.9rem; color: var(--primary-text); line-height: 1.35; white-space: pre-line; font-weight: 600; }
    .divider { height: 1px; background: var(--divider); margin: 8px 0; }
  </style>
</head>
<body>

<div class="container">
  <div class="form-panel">
    <h2>Налаштування</h2>
    
    <div class="panel-controls">
      <div class="input-group">
        <label>Стиль оформлення</label>
        <select id="themeSelect">
          <option value="light">Світла версія</option>
          <option value="dark">Темна версія</option>
        </select>
      </div>

      <div class="input-group">
        <label>Розмір карток (Масштаб)</label>
        <input type="range" id="scaleSlider" min="0.6" max="1.1" step="0.05" value="1">
      </div>

      <div class="input-group">
        <label>Фон (Назва файлу або URL)</label>
        <input type="text" id="inBg" value="salon.png">
      </div>
    </div>

    <div id="itemsContainer"></div>

    <div class="panel-controls" style="margin-top: 10px;">
      <div class="add-controls">
        <button class="btn btn-gray" onclick="addDate()">+ Додати дату</button>
        <button class="btn btn-dark" onclick="addMaster()">+ Додати майстра</button>
      </div>
      <button class="btn btn-success" onclick="downloadImage()">Завантажити PNG</button>
    </div>
  </div>

  <div class="preview-panel" id="previewBg" data-theme="light">
    <div class="story-content">
      <div class="cards-wrapper" id="outCardsWrapper"></div>
      <div class="safe-zone" id="safeZone">Місце для кнопки Instagram</div>
    </div>
  </div>
</div>

<script>
  const MASTERS_LIST = [
    "топ Катерина",
    "топ+ Христина",
    "топ+ Наталія",
    "топ+ Тетяна",
    "майстер-бровист Ілона"
  ];

  let items = [
    { id: 1, type: 'date', text: '04.08' },
    { id: 2, type: 'master', title: 'топ Катерина', text: '09:00 — гігієнічний манікюр\n17:00 — манікюр' }
  ];

  // Зміна теми
  document.getElementById('themeSelect').addEventListener('change', e => {
    document.getElementById('previewBg').setAttribute('data-theme', e.target.value);
  });

  // Зміна фону
  document.getElementById('inBg').addEventListener('input', e => {
    const bgValue = e.target.value.trim();
    if(bgValue) document.getElementById('previewBg').style.backgroundImage = `url('${bgValue}')`;
  });

  // Масштабування контенту
  document.getElementById('scaleSlider').addEventListener('input', e => {
    document.getElementById('outCardsWrapper').style.transform = `scale(${e.target.value})`;
  });

  function renderForm() {
    const formContainer = document.getElementById('itemsContainer');
    formContainer.innerHTML = '';

    items.forEach((item) => {
      const formCard = document.createElement('div');
      
      if(item.type === 'date') {
        formCard.className = 'form-card date-card';
        formCard.innerHTML = `
          <button class="remove-btn" onclick="removeItem(${item.id})">×</button>
          <div class="input-group" style="margin-bottom:0;">
            <label>Дата</label>
            <input type="text" value="${item.text}" oninput="updateItem(${item.id}, 'text', this.value)">
          </div>
        `;
      } else {
        formCard.className = 'form-card master-card';
        
        let optionsHtml = MASTERS_LIST.map(m => 
          `<option value="${m}" ${item.title === m ? 'selected' : ''}>${m}</option>`
        ).join('');

        formCard.innerHTML = `
          <button class="remove-btn" onclick="removeItem(${item.id})">×</button>
          <div class="input-group">
            <label>Майстер</label>
            <select onchange="updateItem(${item.id}, 'title', this.value)">
              ${optionsHtml}
            </select>
          </div>
          <div class="input-group" style="margin-bottom:0;">
            <label>Години</label>
            <textarea rows="2" oninput="updateItem(${item.id}, 'text', this.value)">${item.text}</textarea>
          </div>
        `;
      }
      formContainer.appendChild(formCard);
    });
  }

  function renderPreview() {
    const previewContainer = document.getElementById('outCardsWrapper');
    previewContainer.innerHTML = '';

    let groups = [];
    let currentGroup = { date: '', masters: [] };

    items.forEach(item => {
      if(item.type === 'date') {
        if(currentGroup.date !== '' || currentGroup.masters.length > 0) groups.push(currentGroup);
        currentGroup = { date: item.text, masters: [] };
      } else {
        currentGroup.masters.push(item);
      }
    });
    if(currentGroup.date !== '' || currentGroup.masters.length > 0) groups.push(currentGroup);

    groups.forEach((g, index) => {
      if (!g.date && g.masters.length === 0) return;
      
      const alignmentClass = (index % 2 === 0) ? 'align-left' : 'align-right';
      const groupDiv = document.createElement('div');
      groupDiv.className = `date-group ${alignmentClass}`;
      
      let html = '';
      if (g.date) html += `<div class="date-badge">${g.date}</div>`;
      
      if (g.masters.length > 0) {
        html += `<div class="glass-card">`;
        g.masters.forEach((m, mIndex) => {
          const formattedText = m.text.replace(/\n/g, '<br>');
          html += `
            <div class="master-block">
              <div class="master-title">${m.title}</div>
              <div class="slots-list">${formattedText}</div>
            </div>
          `;
          if(mIndex < g.masters.length - 1) html += `<div class="divider"></div>`;
        });
        html += `</div>`;
      }
      groupDiv.innerHTML = html;
      previewContainer.appendChild(groupDiv);
    });
  }

  function scrollToBottom() {
    setTimeout(() => {
      const container = document.getElementById('itemsContainer');
      container.scrollTo({ top: container.scrollHeight, behavior: 'smooth' });
    }, 50);
  }

  function addDate() {
    items.push({ id: Date.now(), type: 'date', text: 'Нова дата' });
    renderForm(); renderPreview(); scrollToBottom();
  }

  function addMaster() {
    items.push({ id: Date.now(), type: 'master', title: MASTERS_LIST[0], text: '10:00, 12:00' });
    renderForm(); renderPreview(); scrollToBottom();
  }

  function removeItem(id) {
    items = items.filter(i => i.id !== id);
    renderForm(); renderPreview();
  }

  function updateItem(id, field, value) {
    const item = items.find(i => i.id === id);
    if(item) { item[field] = value; renderPreview(); }
  }

  function downloadImage() {
    const preview = document.getElementById('previewBg');
    const safeZone = document.getElementById('safeZone');
    
    // Ховаємо текст безпечної зони для скачування, але залишаємо її розмір
    safeZone.style.color = 'transparent';
    safeZone.style.borderTop = 'none';

    html2canvas(preview, { 
      scale: 3, // Висока якість картинки
      useCORS: true,
      backgroundColor: null
    }).then(canvas => {
      // Повертаємо вигляд безпечної зони
      safeZone.style.color = '';
      safeZone.style.borderTop = '';

      const link = document.createElement('a');
      link.download = 'schedule_story.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    });
  }

  renderForm();
  renderPreview();
</script>

</body>
</html>
