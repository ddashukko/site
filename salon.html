<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Генератор Story – Салон Краси</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #1a1a1a;
      --glass-bg: rgba(255, 255, 255, 0.78);
      --glass-border: rgba(255, 255, 255, 0.4);
      --accent-color: #8e7d71;
      --danger: #d9534f;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Montserrat', sans-serif; }

    body {
      background: #ece9e6; display: flex; justify-content: center; align-items: flex-start;
      min-height: 100vh; padding: 20px; color: #333;
    }

    .container {
      display: flex; gap: 30px; max-width: 1050px; width: 100%; flex-wrap: wrap; justify-content: center;
    }

    /* Панель введення */
    .form-panel {
      flex: 1; min-width: 340px; background: #ffffff; padding: 25px; border-radius: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.05); max-height: 90vh; overflow-y: auto;
    }

    .form-panel h2 { font-size: 1.2rem; font-weight: 700; margin-bottom: 15px; color: var(--primary); }

    .input-group { margin-bottom: 15px; }
    .input-group label { display: block; font-size: 0.8rem; font-weight: 600; margin-bottom: 5px; text-transform: uppercase; color: #666; }
    .input-group input, .input-group textarea, .input-group select {
      width: 100%; padding: 10px 12px; border: 1px solid #ddd; border-radius: 8px; font-size: 0.9rem; outline: none; transition: 0.2s;
    }
    .input-group input:focus, .input-group textarea:focus, .input-group select:focus { border-color: var(--accent-color); }

    .form-card {
      background: #f9f9f9; border: 1px solid #eee; padding: 15px; border-radius: 12px;
      margin-bottom: 15px; position: relative;
    }
    .form-card.date-card { background: #f0f4f8; border-color: #d9e2ec; }
    
    .remove-btn {
      position: absolute; top: 10px; right: 10px; background: var(--danger); color: white;
      border: none; width: 24px; height: 24px; border-radius: 50%; cursor: pointer;
      font-weight: bold; font-size: 12px; display: flex; align-items: center; justify-content: center;
    }

    .add-controls { display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; }
    .add-controls select { flex: 1; min-width: 150px; }
    .btn-add {
      background: var(--primary); color: #fff; border: none; padding: 10px 15px;
      border-radius: 8px; cursor: pointer; font-weight: 600; font-size: 0.85rem; flex: 1;
    }
    .btn-add.date-btn { background: #4a5568; }

    /* Попередній перегляд Story */
    .preview-panel {
      width: 340px; height: 604px; position: sticky; top: 20px; border-radius: 24px;
      overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.15);
      background: #ccc url('salon.jpg') center/cover no-repeat;
      display: flex; flex-direction: column; justify-content: space-between; padding: 30px 20px;
    }
    .preview-panel::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.25); z-index: 1;
    }

    .story-content {
      position: relative; z-index: 2; display: flex; flex-direction: column; height: 100%;
    }

    .cards-wrapper {
      flex: 1; display: flex; flex-direction: column; gap: 20px; overflow-y: auto; padding-bottom: 15px;
    }
    .cards-wrapper::-webkit-scrollbar { display: none; }

    .date-group {
      display: flex; flex-direction: column; gap: 8px; max-width: 85%;
    }
    .date-group.align-left { align-self: flex-start; align-items: flex-start; }
    .date-group.align-right { align-self: flex-end; align-items: flex-end; }
    .date-group.align-right .glass-card { text-align: left; width: 100%; }

    .date-badge {
      background: var(--glass-bg); backdrop-filter: blur(12px); border: 1px solid var(--glass-border);
      padding: 6px 18px; border-radius: 20px; font-weight: 700; font-size: 0.95rem;
      color: var(--primary); box-shadow: 0 4px 15px rgba(0,0,0,0.05); display: inline-block;
    }

    .glass-card {
      background: var(--glass-bg); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--glass-border); border-radius: 18px; padding: 15px 20px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08); width: 100%;
    }

    .master-block { margin-bottom: 12px; }
    .master-block:last-child { margin-bottom: 0; }
    .master-title { font-size: 0.75rem; font-weight: 600; text-transform: uppercase; letter-spacing: 1px; color: var(--accent-color); margin-bottom: 4px; }
    .slots-list { font-size: 0.9rem; color: var(--primary); line-height: 1.4; white-space: pre-line; font-weight: 500; }
    .divider { height: 1px; background: rgba(0,0,0,0.08); margin: 10px 0; }

    .cta-button {
      background: var(--primary); color: #fff; text-align: center; padding: 12px;
      border-radius: 30px; font-weight: 600; font-size: 0.8rem; letter-spacing: 1.5px;
      text-transform: uppercase; box-shadow: 0 4px 15px rgba(0,0,0,0.2); margin-top: 10px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>

<div class="container">
  <div class="form-panel">
    <h2>Налаштування</h2>
    
    <div class="input-group">
      <label>Фон (Назва файлу або URL)</label>
      <input type="text" id="inBg" value="salon.jpg">
    </div>

    <hr style="margin: 20px 0; border: 0; border-top: 1px solid #ddd;">
    
    <div class="add-controls">
      <button class="btn-add date-btn" onclick="addDate()">+ ДОДАТИ ДАТУ (Нова картка)</button>
    </div>
    
    <div class="add-controls">
      <select id="presetMaster">
        <option value="">-- Власний текст --</option>
        <option value="топ Катерина">топ Катерина</option>
        <option value="топ+ Христина">топ+ Христина</option>
        <option value="топ+ Наталія">топ+ Наталія</option>
        <option value="топ+ Тетяна">топ+ Тетяна</option>
        <option value="майстер-бровист Ілона">майстер-бровист Ілона</option>
      </select>
      <button class="btn-add" onclick="addMaster()">+ ДОДАТИ МАЙСТРА</button>
    </div>

    <div id="itemsContainer"></div>
  </div>

  <div class="preview-panel" id="previewBg">
    <div class="story-content">
      <div class="cards-wrapper" id="outCardsWrapper"></div>
      <div class="cta-button">Записатись</div>
    </div>
  </div>
</div>

<script>
  let items = [
    { id: 1, type: 'date', text: '04.08' },
    { id: 2, type: 'master', title: 'топ Катерина', text: '09:00 — гігієнічний манікюр\n17:00 — манікюр' },
    { id: 3, type: 'date', text: '05.08' },
    { id: 4, type: 'master', title: 'топ Катерина', text: '09:00, 10:30, 16:00' },
    { id: 5, type: 'master', title: 'топ+ Христина', text: '14:30' }
  ];

  document.getElementById('inBg').addEventListener('input', e => document.getElementById('previewBg').style.backgroundImage = `url('${e.target.value}')`);

  // Малює тільки форму зліва (викликається лише при додаванні/видаленні блоків)
  function renderForm() {
    const formContainer = document.getElementById('itemsContainer');
    formContainer.innerHTML = '';

    items.forEach((item) => {
      const formCard = document.createElement('div');
      formCard.className = item.type === 'date' ? 'form-card date-card' : 'form-card';
      
      if(item.type === 'date') {
        formCard.innerHTML = `
          <button class="remove-btn" onclick="removeItem(${item.id})">✕</button>
          <div class="input-group" style="margin-bottom:0;">
            <label>Дата (Початок нової картки)</label>
            <input type="text" value="${item.text}" oninput="updateItem(${item.id}, 'text', this.value)">
          </div>
        `;
      } else {
        formCard.innerHTML = `
          <button class="remove-btn" onclick="removeItem(${item.id})">✕</button>
          <div class="input-group">
            <label>Ім'я / Посада</label>
            <input type="text" value="${item.title}" oninput="updateItem(${item.id}, 'title', this.value)">
          </div>
          <div class="input-group" style="margin-bottom:0;">
            <label>Інформація</label>
            <textarea rows="2" oninput="updateItem(${item.id}, 'text', this.value)">${item.text}</textarea>
          </div>
        `;
      }
      formContainer.appendChild(formCard);
    });
  }

  // Малює тільки макет справа (викликається при будь-якій зміні)
  function renderPreview() {
    const previewContainer = document.getElementById('outCardsWrapper');
    previewContainer.innerHTML = '';

    let groups = [];
    let currentGroup = { date: '', masters: [] };

    items.forEach(item => {
      if(item.type === 'date') {
        if(currentGroup.date !== '' || currentGroup.masters.length > 0) {
          groups.push(currentGroup);
        }
        currentGroup = { date: item.text, masters: [] };
      } else {
        currentGroup.masters.push(item);
      }
    });
    if(currentGroup.date !== '' || currentGroup.masters.length > 0) {
      groups.push(currentGroup);
    }

    groups.forEach((g, index) => {
      if (!g.date && g.masters.length === 0) return;
      
      const alignmentClass = (index % 2 === 0) ? 'align-left' : 'align-right';
      const groupDiv = document.createElement('div');
      groupDiv.className = `date-group ${alignmentClass}`;
      
      let html = '';
      if (g.date) {
        html += `<div class="date-badge">${g.date}</div>`;
      }
      
      if (g.masters.length > 0) {
        html += `<div class="glass-card">`;
        g.masters.forEach((m, mIndex) => {
          const formattedText = m.text.replace(/\n/g, '<br>');
          html += `
            <div class="master-block">
              <div class="master-title">${m.title}</div>
              <div class="slots-list">${formattedText}</div>
            </div>
          `;
          if(mIndex < g.masters.length - 1) {
            html += `<div class="divider"></div>`;
          }
        });
        html += `</div>`;
      }
      
      groupDiv.innerHTML = html;
      previewContainer.appendChild(groupDiv);
    });
  }

  function addDate() {
    items.push({ id: Date.now(), type: 'date', text: 'Нова дата' });
    renderForm();
    renderPreview();
  }

  function addMaster() {
    const select = document.getElementById('presetMaster');
    const newItem = {
      id: Date.now(),
      type: 'master',
      title: select.value || 'Ім\'я майстра',
      text: select.value === 'майстер-бровист Ілона' ? 'Є вільні місця' : '10:00 - манікюр'
    };
    if (select.value === "") newItem.text = ""; 
    items.push(newItem);
    renderForm();
    renderPreview();
  }

  function removeItem(id) {
    items = items.filter(i => i.id !== id);
    renderForm();
    renderPreview();
  }

  function updateItem(id, field, value) {
    const item = items.find(i => i.id === id);
    if(item) {
      item[field] = value;
      renderPreview(); // Оновлюємо ТІЛЬКИ прев'ю справа!
    }
  }

  // Перший запуск
  renderForm();
  renderPreview();
</script>

</body>
</html>
